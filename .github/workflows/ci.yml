name: Optical Lab CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python service and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python lint
        run: python -m ruff check apps packages tests scripts
      - name: API and contract tests
        run: python -m pytest -q
      - name: Verify pinned real optical source import
        run: python scripts/verify_s1_pilots.py
      - name: Real materials to TMM/API end-to-end
        run: python scripts/verify_v1_demo.py
      - name: Documentation structure
        run: python scripts/check_docs.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and material dependencies
        run: python -m pip install -e .
      - name: Import pinned pilot materials
        run: python scripts/verify_s1_pilots.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install web and Playwright dependencies
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run browser E2E
        working-directory: apps/web
        env:
          CI: true
        run: npm run e2e
